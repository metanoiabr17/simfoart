<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagină negăsită — Asociația SIMFOART</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@400;500;600&family=Noto+Music&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EF; --ink:#15120F; --ink-soft:#3A342C;
    --red:#D8391B; --red-deep:#7C2712;
    --serif:'Fraunces', serif; --sans:'Work Sans', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--ink);color:var(--cream);font-family:var(--sans);
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .wrap404{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;position:relative;overflow:hidden;
  }
  .staff-wrap{margin-bottom:32px;position:relative;width:230px;height:192px;}
  .staff-wrap svg{position:absolute;top:0;left:0;}
  .clef-glyph{
    font-family:'Noto Music', serif;color:var(--red);position:absolute;
    line-height:1;font-size:100px;top:61px;left:38px;
  }
  .kicker{font-family:var(--serif);font-style:italic;color:var(--red);font-size:17px;margin-bottom:18px;}
  h1{font-family:var(--serif);font-size:clamp(60px,12vw,110px);font-weight:500;line-height:1;color:var(--cream);}
  h2{font-family:var(--serif);font-size:clamp(22px,3vw,30px);font-weight:400;margin-top:18px;color:var(--cream);}
  p{margin-top:16px;max-width:44ch;color:#C9C2B3;font-size:16px;line-height:1.6;}
  .actions{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;justify-content:center;}
  .btn{
    display:inline-block;padding:14px 28px;font-size:15px;font-weight:500;
    border-radius:2px;transition:all .2s;border:1px solid transparent;text-decoration:none;
  }
  .btn-primary{background:var(--red);color:var(--cream);}
  .btn-primary:hover{background:var(--red-deep);}
  .btn-ghost{border-color:#5C5548;color:var(--cream);}
  .btn-ghost:hover{border-color:var(--cream);}
  footer{padding:24px;text-align:center;font-size:13px;color:#8A8375;}
  footer a{color:#8A8375;}
</style>
</head>
<body>

<div class="wrap404">
  <div class="staff-wrap">
    <svg width="230" height="192" viewBox="0 0 230 192" xmlns="http://www.w3.org/2000/svg">
      <g stroke="rgba(250,246,239,0.28)" stroke-width="1.3">
        <line x1="0" y1="69" x2="230" y2="69"/>
        <line x1="0" y1="88" x2="230" y2="88"/>
        <line x1="0" y1="107" x2="230" y2="107"/>
        <line x1="0" y1="127" x2="230" y2="127"/>
        <line x1="0" y1="146" x2="230" y2="146"/>
      </g>
      <ellipse cx="168" cy="107" rx="7" ry="5.2" fill="#D8391B" transform="rotate(-18 168 107)"/>
      <line x1="174.5" y1="105" x2="174.5" y2="70" stroke="#D8391B" stroke-width="1.8"/>
    </svg>
    <div class="clef-glyph">&#x1D11E;</div>
  </div>

  <div class="kicker">Asociația SIMFOART</div>
  <h1>404</h1>
  <h2>Se pare că am nimerit o notă greșită.</h2>
  <p>Pagina pe care o cauți nu există sau a fost mutată. Hai să te ducem înapoi pe portativul corect.</p>

  <div class="actions">
    <a href="/" class="btn btn-primary">Înapoi la pagina principală</a>
    <a href="/#parteneri" class="btn btn-ghost">Propune un parteneriat</a>
  </div>
</div>

<footer>
  © 2026 Asociația SIMFOART · <a href="mailto:contact@simfoart.ro">contact@simfoart.ro</a>
</footer>

</body>
</html>
